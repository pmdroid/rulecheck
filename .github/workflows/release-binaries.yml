name: Publish CLI archives

# Attaches checksummed native archives to a release that a maintainer has
# published. Nothing here creates a release, and crates.io publication stays in
# crates-publish.yml. Archives are public release assets with no download auth.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rulecheck-cli-archives-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'pmdroid/rulecheck' &&
      startsWith(github.ref, 'refs/tags/rust-v') &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^rust-v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable Rust tag, such as rust-v0.1.1."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The release tag does not resolve to the event commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release commit must be on main."
            exit 1
          fi
          # pack checks the tag against Cargo.toml again when it labels each archive.

  archives:
    needs: verify
    uses: ./.github/workflows/release-archives.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  upload:
    needs: archives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rulecheck-release-archives
          path: dist
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          # Refuse to attach archives if the tag moved after the build started.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG now points to $tagged, not the built commit $GITHUB_SHA."
            exit 1
          fi
          # No --clobber: an asset that already exists is never replaced.
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./*.tar.gz ./*.tar.gz.sha256 SHA256SUMS
