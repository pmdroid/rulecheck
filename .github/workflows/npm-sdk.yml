name: Stage npm SDK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-sdk-staging
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'pmdroid/rulecheck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pack and stage SDK
        shell: bash
        run: |
          npm pack ./sdk --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tarball=("$RUNNER_TEMP"/pmdroid-rulecheck-*.tgz)
          test "${#tarball[@]}" -eq 1
          npm stage publish "${tarball[0]}" --access public --ignore-scripts
