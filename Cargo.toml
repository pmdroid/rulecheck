[package]
name = "rulecheck"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository checks for TypeScript-authored rules"
publish = false

[dependencies]
globset = "0.4"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Parser and grammar are pinned exactly: a grammar change can move syntax findings.
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
tempfile = "3"
