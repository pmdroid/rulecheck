[package]
name = "rulecheck"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository checks for TypeScript-authored rules"
publish = false

[dependencies]
globset = "0.4"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
